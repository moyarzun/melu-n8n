version: '3.8'
services:
  n8n:
    # n8n 2.41.0 (tag estable verificado vía Docker Hub Registry API el 2026-09-22, fuente: n8n-tag.json).
    # N8N_PATH=/n8n/ hace que n8n genere URLs de assets prefijadas (/n8n/static/, /n8n/assets/).
    # Combinado con caddy handle_path /n8n*, los assets se sirven correctamente vía Funnel.
    image: n8nio/n8n:2.41.0
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - N8N_PORT=5678
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://melu-n8n.tailef0a9a.ts.net/n8n/
      - N8N_PROTOCOL=https
    volumes:
      - ./data:/home/node/.n8n
