version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=http://your-pi-ip:5678
      - N8N_PROTOCOL=http
    volumes:
      - ./data:/home/node/.n8n
